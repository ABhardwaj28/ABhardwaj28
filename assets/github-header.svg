<svg width="1200" height="300" viewBox="0 0 1200 300"
xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300">
    <stop offset="0%" stop-color="#070809"/>
    <stop offset="55%" stop-color="#0B0F0D"/>
    <stop offset="100%" stop-color="#101711"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop offset="0%" stop-color="#B6E36A" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#B6E36A" stop-opacity="0"/>
  </radialGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="5"/>
  </filter>

</defs>


<!-- BACKGROUND -->

<rect width="1200" height="300" rx="18" fill="url(#bg)"/>


<!-- SUBTLE GRID -->

<g opacity="0.035">

  <path d="M0 40H1200"/>
  <path d="M0 80H1200"/>
  <path d="M0 120H1200"/>
  <path d="M0 160H1200"/>
  <path d="M0 200H1200"/>
  <path d="M0 240H1200"/>
  <path d="M40 0V300"/>
  <path d="M80 0V300"/>
  <path d="M120 0V300"/>
  <path d="M160 0V300"/>
  <path d="M200 0V300"/>

</g>


<!-- LEFT ACCENT -->

<rect
x="76"
y="86"
width="3"
height="122"
rx="2"
fill="#B6E36A"/>


<!-- NAME -->

<text
x="108"
y="128"
fill="#F2F4F2"
font-family="Arial, Helvetica, sans-serif"
font-size="43"
font-weight="700"
letter-spacing="2">

APOORVA BHARDWAJ

</text>


<!-- PERSONAL LINE -->

<text
x="110"
y="166"
fill="#B5BCB6"
font-family="Arial, Helvetica, sans-serif"
font-size="16">

Curious about how things work. Building to find out.

</text>


<!-- TECH LINE -->

<text
x="110"
y="199"
fill="#A8D961"
font-family="Arial, Helvetica, sans-serif"
font-size="11"
font-weight="600"
letter-spacing="3">

SOFTWARE • AI • DATA • PHYSICS

</text>


